- id: '1734652270141'
  alias: Subwoofer control
  description: Turn off subwoofer daily at 22:30, turn back on when the Apple TV next
    turns on, but not before 08:00 the next morning.
  triggers:
  - trigger: time
    at: '22:30'
    id: time_off
  - trigger: state
    entity_id: media_player.living_room_apple_tv
    to: 'on'
    id: apple_tv_on
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: time_off
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.subwoofer
    - conditions:
      - condition: trigger
        id: apple_tv_on
      - condition: time
        after: 08:00:00
        before: '22:30:00'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.subwoofer
  mode: single
- id: d8c57ffd5bba4dedad37a8395fe8b900
  alias: Turn off lights when no one is home
  description: Turn off all lights and remote when both people are away for 1 minute
  triggers:
  - trigger: state
    entity_id: group.family
    to: not_home
    for:
      minutes: 1
  conditions:
  - condition: state
    entity_id: device_tracker.neils_iphone_15_pro
    state: not_home
  - condition: state
    entity_id: device_tracker.iphone_de_chloe
    state: not_home
  actions:
  - action: script.turn_off_all_lights
  - action: remote.turn_off
    target:
      device_id: bd687bdf230593e0c9d1c6f1e77fc8bb
  mode: single
- id: 02effbd3c56e4e11a691e7f94e1b0c59
  alias: Sync guest room sofa with lamp on
