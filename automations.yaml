- id: adaptive_lighting_master_toggle
  alias: Adaptive Lighting Master Toggle
  description: Turn all Adaptive Lighting switches on/off when the master boolean
    changes
  triggers:
  - platform: state
    entity_id: input_boolean.adaptive_lighting_master
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.adaptive_lighting_master
        state: 'on'
      sequence:
      - service: switch.turn_on
        target:
          entity_id:
          - switch.home_adaptive_lighting_home
          - switch.bedroom_adaptive_lighting_bedroom
          - switch.hallway_adaptive_lighting_hallway
          - switch.kitchen_adaptive_lighting_kitchen
          - switch.guest_room_adaptive_lighting_guest_room
          - switch.bathroom_adaptive_lighting_bathroom
          - switch.en_suite_adaptive_lighting_en_suite
    - conditions:
      - condition: state
        entity_id: input_boolean.adaptive_lighting_master
        state: 'off'
      sequence:
      - service: switch.turn_off
        target:
          entity_id:
          - switch.home_adaptive_lighting_home
          - switch.bedroom_adaptive_lighting_bedroom
          - switch.hallway_adaptive_lighting_hallway
          - switch.kitchen_adaptive_lighting_kitchen
          - switch.guest_room_adaptive_lighting_guest_room
          - switch.bathroom_adaptive_lighting_bathroom
          - switch.en_suite_adaptive_lighting_en_suite
          - switch.adaptive_lighting_bathroom_adaptive_lighting_sleep_mode_bathroom
          - switch.adaptive_lighting_bedroom_adaptive_lighting_sleep_mode_bedroom
          - switch.adaptive_lighting_guest_room_adaptive_lighting_sleep_mode_guest_room
          - switch.adaptive_lighting_living_room_adaptive_lighting_sleep_mode_living_room
          - switch.adaptive_lighting_hallway_adaptive_lighting_sleep_mode_hallway
          - switch.adaptive_lighting_kitchen_adaptive_lighting_sleep_mode_kitchen
          - switch.adaptive_lighting_en_suite_adaptive_lighting_sleep_mode_en_suite
  mode: single
- id: bedroom_al_min_brightness_apply
  alias: Bedroom Adaptive Lighting - Apply Brightness Override
  description: Clears manual_control on all Bedroom lights first (so a light that
    was previously manually adjusted, e.g. neil_light/chloe_light, isn't stuck ignoring
    Adaptive Lighting - autoreset_control_seconds is 0 so that never clears on its
    own). When the slider is above 0, pins the Bedroom Adaptive Lighting brightness
    to that exact value (by setting min_brightness and max_brightness to the same
    number, collapsing the curve to a flat line) regardless of time of night. When
    the slider is at 0, restores the switch's normal configured brightness curve.
  triggers:
  - platform: state
    entity_id: input_number.bedroom_al_min_brightness
  actions:
  - action: adaptive_lighting.set_manual_control
    target:
      entity_id: switch.bedroom_adaptive_lighting_bedroom
    data:
      manual_control: false
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: input_number.bedroom_al_min_brightness
        above: 0
      sequence:
      - action: adaptive_lighting.change_switch_settings
        target:
          entity_id: switch.bedroom_adaptive_lighting_bedroom
        data:
          min_brightness: '{{ trigger.to_state.state | int }}'
          max_brightness: '{{ trigger.to_state.state | int }}'
    default:
    - action: adaptive_lighting.change_switch_settings
      target:
        entity_id: switch.bedroom_adaptive_lighting_bedroom
      data:
        use_defaults: configuration
  mode: single
- id: bedroom_al_min_brightness_reset_sunrise
  alias: Bedroom Adaptive Lighting - Reset Brightness Override at Sunrise
  description: Turn the override slider back to 0 at sunrise, which lets the apply
    automation restore Bedroom's normal Adaptive Lighting curve
  triggers:
  - platform: sun
    event: sunrise
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.bedroom_al_min_brightness
    data:
      value: 0
  mode: single
- id: living_room_knob_fan_toggle_and_speed
  alias: Living room knob - fan toggle and speed
  triggers:
  - topic: zigbee2mqtt/Smart Knob 2
    trigger: mqtt
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json.action in [''rotate_right'', ''rotate_left'',
      ''single'', ''click''] }} '
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload_json.action == ''rotate_right'' }}'
      sequence:
      - target:
          entity_id: fan.living_room_fan
        action: fan.increase_speed
        data:
          percentage_step: 16
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload_json.action == ''rotate_left'' }}'
      sequence:
      - target:
          entity_id: fan.living_room_fan
        action: fan.decrease_speed
        data:
          percentage_step: 16
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload_json.action in [''single'', ''click'']
          }}'
      sequence:
      - target:
          entity_id: fan.living_room_fan
        action: fan.toggle
  mode: single
