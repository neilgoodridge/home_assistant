- id: heating_boost_timer
  alias: Heating Timer
  triggers:
  - trigger: state
    entity_id: input_boolean.heating_boost_active
    to: 'on'
  actions:
  - wait_template: '{{ states("input_boolean.heating_boost_active") == "off" or states("input_number.heating_boost_minutes")
      | int(0) <= 0 }}'
    timeout: 01:00:00
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.heating_boost_active
  - action: input_number.set_value
    target:
      entity_id: input_number.heating_boost_minutes
    data:
      value: 0
  mode: restart
- id: heating_boost
  alias: Heating Boost
  description: Manual heating boost via slider — activate, cancel, and per-minute
    countdown
  triggers:
  - trigger: numeric_state
    entity_id: input_number.heating_boost_minutes
    above: 0
    id: activated
  - trigger: numeric_state
    entity_id: input_number.heating_boost_minutes
    below: 1
    id: cancelled
  - trigger: time_pattern
    minutes: /1
    id: tick
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: activated
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.heating_boost_active
      - action: button.press
        target:
          entity_id: button.wiser_boost_all_heating
    - conditions:
      - condition: trigger
        id: cancelled
      - condition: state
        entity_id: input_boolean.heating_boost_active
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heating_boost_active
      - action: button.press
        target:
          entity_id: button.wiser_cancel_all_heating_overrides
    - conditions:
      - condition: trigger
        id: tick
      - condition: state
        entity_id: input_boolean.heating_boost_active
        state: 'on'
      sequence:
      - choose:
        - conditions:
          - condition: numeric_state
            entity_id: input_number.heating_boost_minutes
            below: 1
          sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.heating_boost_active
          - action: button.press
            target:
              entity_id: button.wiser_cancel_all_heating_overrides
          - action: input_number.set_value
            target:
              entity_id: input_number.heating_boost_minutes
            data:
              value: 0
        default:
        - action: input_number.set_value
          target:
            entity_id: input_number.heating_boost_minutes
          data:
            value: '{{ states(''input_number.heating_boost_minutes'') | int - 1 }}'
  mode: restart
- id: heating_off_when_timer_zero
  alias: Heating Off When Timer Zero
  description: Force climate.heating off whenever the boost timer reaches zero, independent
    of the busy heating_boost automation so rapid slider drags can't interrupt it
  triggers:
  - trigger: numeric_state
    entity_id: input_number.heating_boost_minutes
    below: 1
  actions:
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.heating
    data:
      hvac_mode: 'off'
  mode: single
- id: dehumidifier_boost
  alias: Dehumidifier Boost
  description: Manual dehumidifier boost via slider — activate, cancel, and per-minute
    countdown
  triggers:
  - trigger: numeric_state
    entity_id: input_number.dehumidifier_boost_minutes
    above: 0
    id: activated
  - trigger: numeric_state
    entity_id: input_number.dehumidifier_boost_minutes
    below: 1
    id: cancelled
  - trigger: time_pattern
    minutes: /1
    id: tick
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: activated
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.dehumidifier_boost_active
      - action: humidifier.turn_on
        target:
          entity_id: humidifier.dehumidifier
      - action: select.select_option
        target:
          entity_id: select.dehumidifier_countdown
        data:
          option: cancel
    - conditions:
      - condition: trigger
        id: cancelled
      - condition: state
        entity_id: input_boolean.dehumidifier_boost_active
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.dehumidifier_boost_active
      - action: humidifier.turn_off
        target:
          entity_id: humidifier.dehumidifier
      - action: select.select_option
        target:
          entity_id: select.dehumidifier_countdown
        data:
          option: cancel
    - conditions:
      - condition: trigger
        id: tick
      - condition: numeric_state
        entity_id: input_number.dehumidifier_boost_minutes
        above: 0
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_boost_minutes
        data:
          value: '{{ (states(''input_number.dehumidifier_boost_minutes'') | int(0))
            - 1 }}'
  mode: restart
- id: bathroom_extractor_boost
  alias: Bathroom Extractor Boost
  description: Manual boost via slider, or automatic start after the bathroom light
    has been on 3.5 minutes; single per-minute countdown gated on the light being
    off (unifies the old extractor_boost_* and bathroom_extractor_* automations, which
    independently decremented the same timer)
  triggers:
  - trigger: numeric_state
    entity_id: input_number.bathroom_extractor_minutes_remaining
    above: 0
    id: activated
  - trigger: numeric_state
    entity_id: input_number.bathroom_extractor_minutes_remaining
    below: 1
    id: cancelled
  - trigger: time_pattern
    minutes: /1
    id: tick
  - trigger: state
    entity_id: light.bathroom_light
    to: 'on'
    for:
      hours: 0
      minutes: 3
      seconds: 30
    id: light_on_auto_start
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: activated
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.extractor_boost_active
      - action: switch.turn_on
        target:
          entity_id: switch.extractor_fan
    - conditions:
      - condition: trigger
        id: cancelled
      - condition: state
        entity_id: input_boolean.extractor_boost_active
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.extractor_boost_active
      - action: switch.turn_off
        target:
          entity_id: switch.extractor_fan
      - action: input_number.set_value
        target:
          entity_id: input_number.bathroom_extractor_minutes_remaining
        data:
          value: 0
    - conditions:
      - condition: trigger
        id: tick
      - condition: state
        entity_id: input_boolean.extractor_boost_active
        state: 'on'
      - condition: state
        entity_id: light.bathroom_light
        state: 'off'
      sequence:
      - choose:
        - conditions:
          - condition: numeric_state
            entity_id: input_number.bathroom_extractor_minutes_remaining
            below: 1
          sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.extractor_boost_active
          - action: switch.turn_off
            target:
              entity_id: switch.extractor_fan
          - action: input_number.set_value
            target:
              entity_id: input_number.bathroom_extractor_minutes_remaining
            data:
              value: 0
        default:
        - action: input_number.set_value
          target:
            entity_id: input_number.bathroom_extractor_minutes_remaining
          data:
            value: '{{ states(''input_number.bathroom_extractor_minutes_remaining'')
              | int - 1 }}'
    - conditions:
      - condition: trigger
        id: light_on_auto_start
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.extractor_fan
      - action: input_number.set_value
        target:
          entity_id: input_number.bathroom_extractor_minutes_remaining
        data:
          value: 10
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.extractor_boost_active
  mode: restart
- id: fa4ac719b6a34d83a139f4f03ff39377
  alias: Notify when device becomes unavailable
