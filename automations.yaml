- id: medication_reminder_every_36_hours
  alias: Medication Reminder Every 36 Hours
  description: Send a medication reminder every 36 hours starting 2026-07-28 at 20:00
  triggers:
  - minutes: '0'
    trigger: time_pattern
  conditions:
  - condition: template
    value_template: '{% set start = as_timestamp(strptime(''2026-08-17 20:00:00'',
      ''%Y-%m-%d %H:%M:%S'')) %} {% set current = as_timestamp(now().replace(minute=0,
      second=0, microsecond=0)) %} {{ current >= start and ((current - start) | int(0))
      % 129600 == 0 }}'
  actions:
  - action: notify.neil_only
    data:
      message: Time to take your medication
      title: "\U0001F48A"
  mode: single
