      - type: custom:bubble-card
        card_type: pop-up
        hash: '#heating'
        name: Heating
        icon: mdi:radiator
        bg_color: '#1A1512'
        bg_opacity: 70
        bg_blur: 3
        width_desktop: '380px'
        popup_mode: centered
        show_close_button: false
        styles: |
          .bubble-pop-up-background {
            border: 2px solid #E08D5B !important;
          }
          .bubble-container {
            background: transparent !important;
          }
          .bubble-icon-container {
            background: transparent !important;
            # border: 2px solid #E08D5B !important;
          }
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            show_name: false
            icon: mdi:information-outline
            tap_action:
              action: more-info
              entity: climate.heating
            styles: |
              .bubble-button-card-container {
                position: absolute !important;
                top: 28px !important;
                transform: translateY(-50%) !important;
                right: 18px !important;
                width: 36px !important;
                height: 36px !important;
                min-height: 36px !important;
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
                z-index: 10 !important;
              }
              .bubble-icon {
                color: #E08D5B !important;
              }
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: input_number.heating_boost_minutes
            name: Timer
            icon: mdi:timer-outline
            show_state: true
            styles: |
              .bubble-button-card-container {
                background: rgba(38, 32, 28, 0.7) !important;
                border-radius: 28px !important;
                border: 2px solid #E08D5B !important;
              }
              .bubble-icon {
                color: #E08D5B !important;
              }
              .bubble-range-fill {
                background: #E08D5B !important;
              }

      - type: conditional
        conditions:
          - entity: input_boolean.living_room_fan_light_popup
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: ""
          tap_action:
            action: call-service
            service: input_boolean.turn_off
            target:
              entity_id: input_boolean.living_room_fan_light_popup
          card_mod:
            style: |
              ha-card {
                position: fixed !important;
                inset: 0 !important;
                z-index: 998 !important;
                background: rgba(0, 0, 0, 0.6) !important;
                backdrop-filter: blur(4px) !important;
                -webkit-backdrop-filter: blur(4px) !important;
                box-shadow: none !important;
              }

      - type: conditional
        conditions:
          - entity: input_boolean.living_room_fan_light_popup
            state: "on"
        card:
          type: custom:vertical-stack-in-card
          cards:
            - type: custom:vertical-stack-in-card
              cards:
                - type: horizontal-stack
                  cards:
                    - type: custom:mushroom-template-card
                      primary: Light Down
                      icon: mdi:brightness-5
                      layout: horizontal
                      icon_color: '#919B6D'
                      tap_action:
                        action: call-service
                        service: script.living_room_fan_light_down
                      card_mod:
                        style:
                          .: |
                            ha-card {
                              background: rgba(38, 42, 26, 0.6) !important;
                              border: 2px solid #919B6D !important;
                              border-radius: 12px !important;
                              box-shadow: none !important;
                              --primary-text-color: #919B6D;
                              font-size: 0.72rem !important;
                              margin-right: 10px !important;
                              align-items: center !important;
                              justify-content: center !important;
                            }
                            .container {
                              justify-content: center !important;
                            }
                            .content {
                              justify-content: center !important;
                              flex: none !important;
                              gap: 4px !important;
                            }
                          mushroom-state-info$: |
                            .container {
                              align-items: center !important;
                              text-align: center !important;
                            }
                          ha-tile-icon$: |
                            :host {
                              --tile-icon-opacity: 0 !important;
                            }
                    - type: custom:mushroom-template-card
                      primary: Light Up
                      alignment: center
                      icon: mdi:brightness-7
                      layout: horizontal
                      icon_color: '#919B6D'
                      tap_action:
                        action: call-service
                        service: script.living_room_fan_light_up
                      card_mod:
                        style:
                          .: |
                            ha-card {
                              background: rgba(38, 42, 26, 0.6) !important;
                              border: 2px solid #919B6D !important;
                              border-radius: 12px !important;
                              box-shadow: none !important;
                              --primary-text-color: #919B6D;
                              font-size: 0.72rem !important;
                              align-items: center !important;
                              justify-content: center !important;
                            }
                            .container {
                              justify-content: center !important;
                            }
                            .content {
                              justify-content: center !important;
                              flex: none !important;
                              gap: 4px !important;
                            }
                          mushroom-state-info$: |
                            .container {
                              align-items: center !important;
                              text-align: center !important;
                            }
                          ha-tile-icon$: |
                            :host {
                              --tile-icon-opacity: 0 !important;
                            }
              card_mod:
                style: |
                  ha-card {
                    background: transparent !important;
                    border: none !important;
                    box-shadow: none !important;
                    padding: 0 !important;
                    margin: 0 0 16px 0 !important;
                  }

            - type: custom:vertical-stack-in-card
              cards:
                - type: tile
                  entity: fan.living_room_fan
                  name: Fans
                  alignment: center
                  icon: mdi:fan
                  color: '#a3b478'
                  show_entity_picture: false
                  hide_state: true
                  show_name: false
                  show_icon: false
                  vertical: false
                  tap_action:
                    action: toggle
                  features:
                    - type: fan-speed
                  card_mod:
                    style:
                      .: |
                        {% set p = state_attr('fan.living_room_fan', 'percentage') %}
                        {% set frac = 'Off' if not is_state('fan.living_room_fan','on') or p is none or p <= 0 else ('1/6' if p <= 17 else '2/6' if p <= 33 else '3/6' if p <= 50 else '4/6' if p <= 67 else '5/6' if p <= 83 else '6/6') %}
                        ha-card {
                          background: rgba(38, 42, 26, 0.6) !important;
                          border: 2px solid #919B6D !important;
                          border-radius: 12px !important;
                          box-shadow: none !important;
                          position: relative;
                          margin: 0px 0px 20px 0px;
                        }
                        ha-card::after {
                          content: "{{ frac }}";
                          position: absolute;
                          bottom: 18%;
                          right: 50%;
                          transform: translateX(50%);
                          font-size: 1.1rem;
                          font-weight: 600;
                          font-variant-numeric: tabular-nums;
                          color: {{ '#FFF' if is_state('fan.living_room_fan', 'on') else '#919B6D' }};
                          pointer-events: none;
                          z-index: 5;
                        }
                      ha-tile-info$: |
                        :host {
                          color: {{ '#FFF' if is_state('fan.living_room_fan', 'on') else '#919B6D' }} !important;
                          --primary-text-color: {{ '#FFF' if is_state('fan.living_room_fan', 'on') else '#919B6D' }} !important;
                        }
                      ha-tile-icon$: |
                        :host {
                          color: {{ '#FFF' if is_state('fan.living_room_fan', 'on') else '#919B6D' }} !important;
                          --tile-color: {{ '#FFF' if is_state('fan.living_room_fan', 'on') else '#919B6D' }} !important;
                          --tile-icon-opacity: 0 !important;
                        }
                - type: horizontal-stack
                  cards:
                    - type: custom:mushroom-template-card
                      primary: Cycle
                      icon: mdi:fan-clock
                      layout: horizontal
                      entity: automation.fan_cycle_living_room
                      icon_color: >-
                        {{ '#FFF' if is_state('automation.fan_cycle_living_room', 'on') else '#919B6D' }}
                      tap_action:
                        action: call-service
                        service: automation.toggle
                        target:
                          entity_id: automation.fan_cycle_living_room
                      card_mod:
                        style:
                          .: |
                            ha-card {
                              background: rgba(38, 42, 26, 0.6) !important;
                              border: 2px solid #919B6D !important;
                              border-radius: 12px !important;
                              box-shadow: none !important;
                              --primary-text-color: {{ '#FFF' if is_state('automation.fan_cycle_living_room', 'on') else '#919B6D' }};
                              font-size: 0.72rem !important;
                              margin-right: 10px !important;
                              align-items: center !important;
                              justify-content: center !important;
                            }
                            .container {
                              justify-content: center !important;
                            }
                            .content {
                              justify-content: center !important;
                              flex: none !important;
                              gap: 4px !important;
                            }
                          mushroom-state-info$: |
                            .container {
                              align-items: center !important;
                              text-align: center !important;
                            }
                          ha-tile-icon$: |
                            :host {
                              --tile-icon-opacity: 0 !important;
                            }
                    - type: custom:mushroom-template-card
                      primary: Reverse
                      icon: mdi:swap-horizontal
                      layout: horizontal
                      icon_color: '#919B6D'
                      tap_action:
                        action: call-service
                        service: script.living_room_fan_reverse
                      card_mod:
                        style:
                          .: |
                            ha-card {
                              background: rgba(38, 42, 26, 0.6) !important;
                              border: 2px solid #919B6D !important;
                              border-radius: 12px !important;
