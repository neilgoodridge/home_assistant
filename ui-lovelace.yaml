            }

      - type: custom:vertical-stack-in-card
        cards:
          - type: tile
            entity: fan.living_room_fan
            name: Fans
            alignment: center
            icon: mdi:fan
            color: '#a3b478'
            show_entity_picture: false
            hide_state: true
            show_name: false
            show_icon: false
            vertical: false
            tap_action:
              action: toggle
            features:
              - type: fan-speed
            card_mod:
              style:
                .: |
                  {% set p = state_attr('fan.living_room_fan', 'percentage') %}
                  {% set frac = 'Off' if not is_state('fan.living_room_fan','on') or p is none or p <= 0 else ('1/6' if p <= 17 else '2/6' if p <= 33 else '3/6' if p <= 50 else '4/6' if p <= 67 else '5/6' if p <= 83 else '6/6') %}
                  ha-card {
                    background: {{ 'rgba(163, 180, 120, 0.14)' if is_state('fan.living_room_fan', 'on') else '#262a1a' }} !important;
                    border: 2px solid {{ '#919B6D' if is_state('fan.living_room_fan', 'on') else '#33361f' }} !important;
                    border-radius: 12px !important;
                    box-shadow: none !important;
                    position: relative;
                    margin: 0px 0px 20px 0px;
                  }
                  ha-card::after {
                    content: "{{ frac }}";
                    position: absolute;
                    bottom: 18%;
                    right: 50%;
                    transform: translateX(50%);
                    font-size: 1.1rem;
                    font-weight: 600;
                    font-variant-numeric: tabular-nums;
                    color: {{ '#FFF' if is_state('fan.living_room_fan', 'on') else '#919B6D' }};
                    pointer-events: none;
                    z-index: 5;
                  }
                ha-tile-info$: |
                  :host {
                    color: {{ '#FFF' if is_state('fan.living_room_fan', 'on') else '#919B6D' }} !important;
                    --primary-text-color: {{ '#FFF' if is_state('fan.living_room_fan', 'on') else '#919B6D' }} !important;
                  }
                ha-tile-icon$: |
                  :host {
                    color: {{ '#FFF' if is_state('fan.living_room_fan', 'on') else '#919B6D' }} !important;
                    --tile-color: {{ '#FFF' if is_state('fan.living_room_fan', 'on') else '#919B6D' }} !important;
                    --tile-icon-opacity: 0 !important;
                  }
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Cycle
                icon: mdi:fan-clock
                layout: horizontal
                entity: automation.fan_cycle_living_room
                icon_color: >-
                  {{ '#FFF' if is_state('automation.fan_cycle_living_room', 'on') else '#919B6D' }}
                tap_action:
                  action: call-service
                  service: automation.toggle
                  target:
                    entity_id: automation.fan_cycle_living_room
                card_mod:
                  style:
