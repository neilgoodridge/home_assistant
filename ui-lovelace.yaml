  extra_module_url:
    - /local/community/custom-sidebar/custom-sidebar-plugin.js?v=1.0.0

resources:
  - url: /local/community/lovelace-mushroom/mushroom.js
    type: module
  - url: /local/community/vertical-stack-in-card/vertical-stack-in-card.js?v=1.0.1
    type: js
  - url: /local/community/mini-graph-card/mini-graph-card-bundle.js?v=0.12.1
    type: module
  - url: /local/community/lovelace-hasl-departure-card/hasl4-departure-card.js
    type: js
  - url: /local/community/lovelace-ha-teamtracker-card/ha-teamtracker-card.js
    type: js
  - url: /local/community/config-template-card/config-template-card.js
    type: js
  - url: /local/community/lovelace-card-mod/card-mod.js
    type: module
  - url: /local/community/button-card/button-card.js
    type: module
  - url: /local/community/stack-in-card/stack-in-card.js
    type: module
  - url: /local/my-rail-commute-card.js
    type: module
  - url: /local/community/HA-Firemote/HA-Firemote.js
    type: module
  - url: /local/community/hass-swipe-navigation/swipe-navigation.js
    type: module
  - url: /local/community/my-cards/my-cards.js
    type: module
  - url: /local/community/Bubble-Card/bubble-card.js
    type: module

swipe_nav:
  wrap: true
  enable_mouse_swipe: true
  animate: swipe
  animate_duration: 150
  prevent_default: true
  swipe_amount: 30

views:
# ---- VIEW 1: Overview / floorplan ----
  - title: Overview
    path: overview
    icon: mdi:floor-plan
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: picture-elements
            image: /local/floorplan/base.png
            elements: !include floorplan_elements.yaml
          - type: custom:mushroom-chips-card # living room / hallway controls
            card_mod:
              style:
                mushroom-entity-chip:nth-child(5)$: |
                  ha-state-icon {
                    animation: {{ 'spin 1.6s linear infinite' if is_state('fan.living_room_fan', 'on') else 'none' }};
                  }
                  @keyframes spin {
                    from { transform: rotate(0deg); }
                    to { transform: rotate(360deg); }
                  }
            chips:
              - type: entity
                entity: scene.living_room_full_lights
                content_info: name
                icon_color: amber
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                double_tap_action:
                  action: toggle
                use_entity_picture: false
                name: "On"
                card_mod:
                  style: |
                    ha-card { border: 1px solid #919B6D !important; border-radius: 20px !important; background: rgba(145,155,109,0.28) !important; }
              - type: entity
                entity: scene.daytime
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                icon_color: amber
                content_info: name
                name: "Day    "
                card_mod:
                  style: |
                    ha-card { border: 1px solid #919B6D !important; border-radius: 20px !important; background: rgba(145,155,109,0.28) !important; }
              - type: entity
                entity: scene.evening
                tap_action:
                  action: toggle
                icon_color: amber
                content_info: name
                card_mod:
                  style: |
                    ha-card { border: 1px solid #919B6D !important; border-radius: 20px !important; background: rgba(145,155,109,0.28) !important; }
              - type: entity
                entity: scene.film_2
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                icon_color: amber
                content_info: name
                card_mod:
                  style: |
                    ha-card { border: 1px solid #919B6D !important; border-radius: 20px !important; margin-right: auto; background: rgba(145,155,109,0.28) !important; }
              - type: entity
                entity: fan.living_room_fan
                tap_action:
                  action: call-service
                  service: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.living_room_fan_light_popup
                hold_action:
                  action: more-info
                icon_color: '#919B6D'
                content_info: none
                card_mod:
                  style: |
                    ha-card { border: 1px solid #919B6D !important; border-radius: 20px !important; margin-right: auto; background: rgba(145,155,109,0.28) !important; }
              - type: spacer
              - type: entity
                entity: scene.living_room_all_off
                tap_action:
                  action: toggle
                content_info: name
                icon_color: red
                name: "Off"
                card_mod:
                  style: |
                    ha-card { border: 1px solid #919B6D !important; border-radius: 20px !important; background: rgba(145,155,109,0.28) !important; }
          - type: custom:mushroom-chips-card # bedroom controls
            card_mod:
              style:
                mushroom-entity-chip:nth-child(4)$: |
                  ha-state-icon {
                    animation: {{ 'spin 1.6s linear infinite' if is_state('fan.bedroom_fan', 'on') else 'none' }};
                  }
                  @keyframes spin {
                    from { transform: rotate(0deg); }
                    to { transform: rotate(360deg); }
                  }
            chips:
              - type: entity
                entity: scene.bedroom_full_lights
                content_info: name
                icon_color: amber
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                double_tap_action:
                  action: toggle
                use_entity_picture: false
                name: "On"
                card_mod:
                  style: |
                    ha-card { border: 1px solid #DCC1C0 !important; border-radius: 20px !important; background: rgba(220,193,192,0.28) !important; }
              - type: entity
                entity: scene.relax
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                icon_color: amber
                content_info: name
                card_mod:
                  style: |
                    ha-card { border: 1px solid #DCC1C0 !important; border-radius: 20px !important; background: rgba(220,193,192,0.28) !important; }
              - type: entity
                entity: scene.reading
                tap_action:
                  action: toggle
                content_info: name
                icon_color: amber
                card_mod:
                  style: |
                    ha-card { border: 1px solid #DCC1C0 !important; border-radius: 20px !important; background: rgba(220,193,192,0.28) !important; }
              - type: entity
                entity: fan.bedroom_fan
                tap_action:
                  action: call-service
                  service: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.bedroom_fan_light_popup
                hold_action:
                  action: more-info
                icon_color: '#DCC1C0'
                content_info: none
                card_mod:
                  style: |
                    ha-card { border: 1px solid #DCC1C0 !important; border-radius: 20px !important; margin-right: auto; background: rgba(220,193,192,0.28) !important; }
              - type: spacer
              - type: entity
                entity: scene.all_off
                tap_action:
                  action: toggle
                content_info: name
                icon_color: red
                name: "Off"
                card_mod:
                  style: |
                    ha-card { border: 1px solid #DCC1C0 !important; border-radius: 20px !important; background: rgba(220,193,192,0.28) !important; }
          - type: custom:mushroom-chips-card # guest room controls
            chips:
              - type: entity
                entity: scene.guest_room_full_lights
                content_info: name
                icon_color: amber
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                double_tap_action:
                  action: toggle
                use_entity_picture: false
                name: "On"
                card_mod:
                  style: |
                    ha-card { border: 1px solid #E8BE62 !important; border-radius: 20px !important; background: rgba(232,190,98,0.28) !important; }
              - type: entity
                entity: scene.relax_2
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                icon_color: amber
                content_info: name
                name: Relax
                card_mod:
                  style: |
                    ha-card { border: 1px solid #E8BE62 !important; border-radius: 20px !important; margin-right: auto; background: rgba(232,190,98,0.28) !important; }
              - type: spacer
              - type: entity
                entity: scene.guest_room_off
                tap_action:
                  action: toggle
                content_info: name
                icon_color: red
                name: "Off"
                card_mod:
                  style: |
                    ha-card { border: 1px solid #E8BE62 !important; border-radius: 20px !important; background: rgba(232,190,98,0.28) !important; }
          - type: custom:mushroom-chips-card # all lights controls
            chips:
              - type: spacer
              - type: entity
                entity: light.all_lights
                content_info: name
                icon_color: red
                icon: mdi:close-circle-outline
                tap_action:
                  action: call-service
                  service: homeassistant.turn_off
                  service_data:
                    entity_id: light.all_lights
                hold_action:
                  action: more-info
                double_tap_action:
                  action: call-service
                  service: homeassistant.turn_off
                  service_data:
                    entity_id: light.all_lights
                # use_entity_picture: false
                name: "All Off"
                align: right

